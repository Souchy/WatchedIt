<img class="backdrop" src.bind="backdropUrl" alt.bind="`Backdrop for ${title}`" />

<header class="overdrop">
  <h1>${title} (${releaseYear})</h1>
</header>
<section class="media-details overdrop">
  <figure class="poster">
    <img src.bind="posterUrl" alt.bind="`Poster for ${title}`" />
  </figure>
  <div class="details-info">
    <div class="state-controls">
      <!-- Set as .. -->
      <button repeat.for="btn of availableWatchStateButtons" class="btn-state" click.trigger="clickWatchStateButton(btn)" aria-label.bind="btn.ariaLabel" title.bind="btn.ariaLabel">
        <i class.bind="btn.iconClass"></i>
      </button>
      <!-- Set unlisted -->
      <button if.bind="resetWatchStateButton" class="reset-button btn-state" aria-label.bind="resetWatchStateButton.ariaLabel" click.trigger="clickWatchStateButton(resetWatchStateButton)" aria-label.bind="resetWatchStateButton.ariaLabel" title.bind="resetWatchStateButton.ariaLabel">
        <i class.bind="resetWatchStateButton.iconClass" aria-hidden="true"></i>
      </button>
    </div>
    <p><strong>Release Date:</strong> ${releaseDate}</p>
    <p><strong>Rating:</strong> ${rating} / 10</p>
    <p><strong>Overview:</strong> ${overview}</p>
    <!-- Add more movie details as needed -->
  </div>
</section>

<section>
  <h2>Recommended TV Shows</h2>
  <movie-list shows.bind="similar" size.bind="120"></movie-list>
  <button click.trigger="moreSimilar()">Load More</button>
</section>

<section>
  <h2>Cast</h2>
  <cast-list cast.bind="credits.cast" size.bind="80"></cast-list>
</section>

<section>
  <h2>Crew</h2>
  <crew-list crew.bind="credits.crew" size.bind="80"></crew-list>
</section>
