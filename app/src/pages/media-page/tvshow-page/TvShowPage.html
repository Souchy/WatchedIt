<img class="backdrop" src.bind="backdropUrl" alt.bind="`Backdrop for ${title}`" />

<header class="overdrop">
  <h1>${title} (${releaseYear})</h1>
</header>
<section class="media-details overdrop">
  <figure class="poster">
    <img src.bind="posterUrl" alt.bind="`Poster for ${title}`" />
  </figure>
  <div class="details-info">
    <au-compose template.bind="stateControlsTemplate"></au-compose>
    <au-compose template.bind="rightBarTemplate"></au-compose>
    <p><strong>Release Date:</strong> ${releaseDate}</p>
    <p><strong>Rating:</strong> ${rating} / 10</p>
    <p><strong>Overview:</strong> ${overview}</p>
    <!-- Add more movie details as needed -->
  </div>
</section>

<!-- <div class="flex-seasons-recommended"> -->
<section>
  <h2>Seasons</h2>
  <season-list show.bind="media" size.bind="120"></season-list>
</section>

<section>
  <h2>Recommended TV Shows</h2>
  <movie-list shows.bind="similar" size.bind="120"></movie-list>
  <button click.trigger="moreSimilar()">Load More</button>
</section>
<!-- </div> -->

<au-compose template.bind="sectionMediaTemplate"></au-compose>

<section>
  <h2>Cast</h2>
  <cast-list cast.bind="credits.cast" size.bind="80"></cast-list>
</section>

<section>
  <h2>Crew</h2>
  <crew-list crew.bind="credits.crew" size.bind="80"></crew-list>
</section>
