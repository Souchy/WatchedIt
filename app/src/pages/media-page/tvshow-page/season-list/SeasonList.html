<ul style.bind="`grid-template-columns: ${columnStyle}`">
  <li repeat.for="season of seasons" if.bind="$index < max">
    <a load="route: tv; params.bind: {id: show.id, seasonId: season.season_number}; context.bind: null" aria-label.bind="`View details for ${season.name}`">
      <figure>
        <img src.bind="`https://image.tmdb.org/t/p/w200${season.poster_path}`" alt.bind="`Poster for ${season.name}`" />
        <figcaption>
          <!-- ${season.season_number} -->
          <p>${season.name}</p>
          <p>${season.air_date}</p>
        </figcaption>
      </figure>
    </a>
  </li>
</ul>

<button if.bind="isShowMoreVisible" click.trigger="showMore()">Show More</button>
